plugins {
    id 'application'
    id 'java'
    id 'com.diffplug.spotless' version '6.25.0'
}

spotless {
    java {
        target 'src/**/*.java'
        googleJavaFormat('1.17.0')  // pick a version compatible with your toolchain
    }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories { mavenCentral() }

application { mainClass = 'metrosim.app.MetroSimApp' }

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
}

tasks.named('run', JavaExec) {
    jvmArgs '-Djava.awt.headless=false'
    // 👇 forward the CLI system property from Gradle to your app's JVM
    def v = System.getProperty('metrosim.cityPack')
    if (v != null) {
        systemProperty 'metrosim.cityPack', v
    }
}
